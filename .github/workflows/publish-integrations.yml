name: Publish integrations

# Publishing is manual: run this workflow from the Actions tab or with
# `bun run publish` in integrations-enterprise.
on:
  workflow_dispatch:
    inputs:
      filter:
        description: 'Optional filter by package, slate.json, or directory name, for example "@slates-integrations/google-*". Empty publishes every unpublished version.'
        required: false
        type: string

concurrency:
  group: publish-integrations
  cancel-in-progress: false

# Only the token jobs (detect, upload) use the slates-registry environment; they install nothing.

jobs:
  detect-unpublished-integrations:
    name: Detect unpublished integrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: slates-registry
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      count: ${{ steps.discover.outputs.count }}
      blocked: ${{ steps.discover.outputs.blocked }}
    steps:
      - name: Require main
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::Publishing runs only from main, not ${GITHUB_REF}."
          exit 1

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
          no-cache: true

      - name: Discover unpublished integration versions
        id: discover
        shell: bash
        env:
          FILTER: ${{ github.event.inputs.filter || '' }}
          SLATES_REGISTRY_URL: ${{ vars.SLATES_REGISTRY_URL }}
          SLATES_REGISTRY_TOKEN: ${{ secrets.SLATES_REGISTRY_TOKEN }}
        run: |
          cmd=(bun --no-install scripts/get-updated-integrations.ts)
          if [[ -n "$FILTER" ]]; then
            cmd+=(--filter "$FILTER")
          fi

          "${cmd[@]}" > "$RUNNER_TEMP/detect.json"
          bun --no-install -e '
            const result = JSON.parse(await Bun.file(process.argv[1]).text());
            const lines = [
              `matrix=${JSON.stringify(result.matrix)}`,
              `count=${result.matrix.include.length}`,
              `blocked=${JSON.stringify(result.blocked)}`
            ];
            (await import("node:fs")).appendFileSync(process.env.GITHUB_OUTPUT, lines.join("\n") + "\n");
          ' "$RUNNER_TEMP/detect.json"

  build-integrations:
    name: Build ${{ matrix.label }}
    needs: detect-unpublished-integrations
    if: ${{ needs.detect-unpublished-integrations.outputs.count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJSON(needs.detect-unpublished-integrations.outputs.matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install

      - name: Build integration packages
        env:
          DIRECTORIES: ${{ matrix.directories }}
        run: |
          filters=()
          for directory in $DIRECTORIES; do
            filters+=("--filter=./$directory")
          done
          bunx turbo run build --continue "${filters[@]}"

      - name: Bundle integrations
        if: ${{ !cancelled() }}
        env:
          DIRECTORIES: ${{ matrix.directories }}
        run: bun scripts/bundle-integration.ts --out "$RUNNER_TEMP/slate-bundles" $DIRECTORIES

      - name: Store bundles
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: slate-bundles-${{ strategy.job-index }}
          path: ${{ runner.temp }}/slate-bundles
          if-no-files-found: ignore
          retention-days: 1
          overwrite: true

  upload-integrations:
    name: Upload integrations to the registry
    needs: [detect-unpublished-integrations, build-integrations]
    if: ${{ !cancelled() && needs.detect-unpublished-integrations.result == 'success' && needs.detect-unpublished-integrations.outputs.count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: slates-registry
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
          no-cache: true

      - name: Download bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: slate-bundles-*
          path: ${{ runner.temp }}/slate-bundles
          merge-multiple: true

      - name: Upload bundles to the registry
        env:
          SLATES_REGISTRY_URL: ${{ vars.SLATES_REGISTRY_URL }}
          SLATES_REGISTRY_TOKEN: ${{ secrets.SLATES_REGISTRY_TOKEN }}
          PUBLISH_MATRIX: ${{ needs.detect-unpublished-integrations.outputs.matrix }}
        run: bun --no-install scripts/upload-integration.ts --bundle-dir "$RUNNER_TEMP/slate-bundles" --expected-matrix-env PUBLISH_MATRIX

  report-blocked-integrations:
    name: Report blocked integrations
    needs: detect-unpublished-integrations
    if: ${{ needs.detect-unpublished-integrations.outputs.blocked != '' && needs.detect-unpublished-integrations.outputs.blocked != '[]' }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Fail on blocked integrations
        env:
          BLOCKED: ${{ needs.detect-unpublished-integrations.outputs.blocked }}
        run: |
          echo "::error::Some integrations cannot be published: $BLOCKED"
          exit 1
